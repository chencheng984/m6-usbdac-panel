<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="color-scheme" content="dark">
<title>M6 · USB DAC</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div id="viewport" class="viewport">
  <div id="app" class="app">

    <img src="assets/texture.webp" alt="" aria-hidden="true" style="position:absolute;left:0;top:0;width:640px;height:360px;z-index:0;opacity:0.30;pointer-events:none">

    <header class="topbar">
      <div class="topbar-title">
        <img class="brand-logo" src="assets/sony-logo.webp" alt="SONY">
      </div>
      <div class="topbar-right">
        <div id="linkPill" class="pill pill--off">
          <span class="pill-dot"></span>
          <span id="linkText" class="pill-text">未连接</span>
        </div>
        <button id="btnExit" class="btn-exit hidden" type="button" aria-label="退出">退出</button>
      </div>
    </header>

    <main class="stage">

      <section id="volumeCard" class="card volume">
        <div id="volRail" class="vol-rail">
          <div class="vol-track">
            <div id="volFill" class="vol-fill"></div>
            <div class="vol-ticks"></div>
          </div>
          <!-- 方向探针：放在轨道的「音量 100」端。
               整页在竖屏时会被 rotate(90deg)，靠它的实际屏幕位置反算手势方向，
               不再依赖「上下」这种会随旋转变化的假设。 -->
          <i id="volProbe" class="vol-probe" aria-hidden="true"></i>
          <div id="volKnob" class="vol-knob"><i id="volNeedle"></i></div>
        </div>
        <div class="vol-readout">
          <div id="volNum" class="vol-num">--</div>
        </div>
      </section>

      <section id="paramsCard" class="card params">
        <div class="rate-line">
          <span id="rateNum" class="rate-num">--</span>
          <span id="rateUnit" class="rate-unit">kHz</span>
        </div>
        <div class="meta-row">
          <div class="meta-cell">
            <div id="bitsVal" class="meta-val">--</div>
            <div class="meta-key">位深</div>
          </div>
          <div class="meta-div"></div>
          <div class="meta-cell">
            <div id="formatVal" class="meta-val">--</div>
            <div class="meta-key">格式</div>
          </div>
          <div class="meta-div"></div>
          <div class="meta-cell">
            <div id="kbpsVal" class="meta-val">--</div>
            <div class="meta-key">码率 kbps</div>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <div class="src-line">
        <span id="srcTag" class="src-tag src-tag--none">无数据源</span>
        <span id="hint" class="hint"></span>
      </div>
    </footer>

    <div id="overlay" class="overlay">
      <div class="overlay-inner">
        <svg class="usb-icon" viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 6v26"></path>
            <circle cx="24" cy="5" r="2.4" fill="currentColor" stroke="none"></circle>
            <path d="M24 18l-7 5v4"></path>
            <rect x="14" y="27" width="6" height="6" rx="1"></rect>
            <path d="M24 24l7 4v5"></path>
            <path d="M28.5 33h5l2 3-2 3h-5z"></path>
            <path d="M17 6v4M31 6v4"></path>
          </g>
          <path class="usb-flow" d="M24 6v26M24 18l-7 5v4M24 24l7 4v5"></path>
        </svg>
        <div class="ov-text">
          <div class="ov-title">未连接 USB</div>
          <div class="ov-desc">请用数据线把 M6 连接到电脑，并在快捷菜单选择「USB DAC」模式。</div>
        </div>
        <button id="recheck" class="btn-recheck" type="button">重新检测</button>
      </div>
    </div>

    <div id="banner" class="banner">
      <span id="bannerText"></span>
    </div>

  </div>
</div>

<script src="js/store.js?v=20261110a"></script>
<script src="js/sources/mock.js?v=20261110a"></script>
<script src="js/sources/bridge.js?v=20261110a"></script>
<script src="js/ui/topbar.js?v=20261110a"></script>
<script src="js/ui/params.js?v=20261110a"></script>
<script src="js/ui/volume.js?v=20261110a"></script>
<script src="js/ui/footer.js?v=20261110a"></script>
<script src="js/main.js?v=20261110a"></script>
</body>
</html>
